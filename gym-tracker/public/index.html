<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E4E7EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161A1F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bitácora de Gym</title>
<meta name="description" content="Tracker de entrenamiento por perfiles: registra series, cargas, repeticiones y RIR, asistencia, medidas corporales y progreso.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BITÁCORA DE GYM
   Un solo archivo, sin dependencias de JS, funciona offline.
   Los datos viven en el navegador (localStorage) y se respaldan
   en JSON desde Ajustes.
   ------------------------------------------------------------
   Idea visual: los colores de los discos olímpicos codifican
   estados. Verde = cumplido, amarillo = parcial, rojo = no
   cumplido, azul = acción principal. Las cifras van en
   condensada, como el estampado de un disco.
   ============================================================ */

/* ---------- Tokens ---------- */
:root{
  --bg:#E4E7EA;        /* concreto */
  --panel:#FFFFFF;
  --panel-2:#F2F4F6;
  --ink:#14202E;       /* tinta azul acero */
  --ink-2:#4B5966;
  --ink-3:#7B8794;
  --line:#CDD3D9;
  --blue:#1F5FC4;      /* disco 20 kg */
  --red:#CF2338;       /* disco 25 kg */
  --yellow:#E2A800;    /* disco 15 kg */
  --green:#1F8C55;     /* disco 10 kg */
  --blue-soft:#DCE7F8;
  --red-soft:#F8DDE1;
  --yellow-soft:#FBF0CC;
  --green-soft:#D7EFE2;
  --on-accent:#FFFFFF;
  --shadow:0 1px 0 rgba(20,32,46,.06),0 6px 18px -10px rgba(20,32,46,.35);
  --r-l:20px; --r-m:14px; --r-s:10px;
  --f-num:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --nav-h:68px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161A1F; --panel:#20262D; --panel-2:#29313A; --ink:#EDF1F4; --ink-2:#A6B2BD; --ink-3:#77838F; --line:#36404A;
    --blue:#6A9BF2; --red:#F0596C; --yellow:#F2C640; --green:#47C283;
    --blue-soft:#24344F; --red-soft:#46242B; --yellow-soft:#433A1C; --green-soft:#1D3D2D;
    --on-accent:#0E1318; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161A1F; --panel:#20262D; --panel-2:#29313A; --ink:#EDF1F4; --ink-2:#A6B2BD; --ink-3:#77838F; --line:#36404A;
  --blue:#6A9BF2; --red:#F0596C; --yellow:#F2C640; --green:#47C283;
  --blue-soft:#24344F; --red-soft:#46242B; --yellow-soft:#433A1C; --green-soft:#1D3D2D;
  --on-accent:#0E1318; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.8);
  color-scheme:dark;
}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f-body);background:var(--bg);color:var(--ink);line-height:1.5;font-size:16px;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
input,select,textarea{background:var(--panel-2);border:1.5px solid var(--line);border-radius:var(--r-s);padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);background:var(--panel)}
textarea{resize:vertical;min-height:70px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--f-num);font-weight:700;line-height:1.1;letter-spacing:.005em}
h2{font-size:1.75rem} h3{font-size:1.25rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Header ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:62px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-num);font-weight:800;font-size:1.25rem;white-space:nowrap}
.brand svg{width:26px;height:26px}
.profiles{display:flex;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none;padding:4px 2px}
.profiles::-webkit-scrollbar{display:none}
.pchip{display:flex;align-items:center;gap:7px;padding:5px 12px 5px 5px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);font-weight:600;font-size:.95rem;white-space:nowrap}
.pchip .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-num);font-weight:700;font-size:.95rem}
.pchip[aria-pressed="true"]{border-color:var(--pc);box-shadow:0 0 0 2px var(--pc) inset}
.syncdot{width:28px;height:40px;flex:none;display:grid;place-items:center}
.syncdot::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink-3)}
.syncdot[data-s="ok"]::before{background:var(--green)}
.syncdot[data-s="saving"]::before{background:var(--yellow)}
.syncdot[data-s="pin"]::before,.syncdot[data-s="nodb"]::before{background:var(--red)}
.syncdot[data-s="offline"]::before,.syncdot[data-s="local"]::before{background:transparent;border:2px solid var(--ink-3)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.iconbtn:hover{background:var(--panel-2);color:var(--ink)}
.iconbtn svg{width:22px;height:22px}

/* ---------- Bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h);padding:0 4px}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.78rem;font-weight:600;color:var(--ink-3);border-radius:12px}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] svg{stroke-width:2.4}

/* ---------- Layout ---------- */
main{padding-top:18px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 14px}
.view-head p{color:var(--ink-2);font-size:.95rem}
.card{background:var(--panel);border-radius:var(--r-l);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.card.flat{box-shadow:none;border:1.5px solid var(--line);background:transparent}
.card h3{margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center}
.row.wrapr{flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stack>*+*{margin-top:10px}
label.f{display:block;font-size:.85rem;font-weight:600;color:var(--ink-2)}
label.f>input,label.f>select,label.f>textarea{margin-top:4px;color:var(--ink);font-weight:500}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.empty{padding:22px;text-align:center;color:var(--ink-2);border:1.5px dashed var(--line);border-radius:var(--r-m)}

/* ---------- Buttons ---------- */
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:var(--r-m);font-weight:700;background:var(--panel-2);border:1.5px solid var(--line);color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.9rem;border-radius:var(--r-s)}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.seg{display:inline-flex;background:var(--panel-2);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 12px;border-radius:9px;font-weight:600;font-size:.9rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- Mesocycle strip (5 discos) ---------- */
.meso{display:flex;gap:8px;align-items:center}
.meso .disc{flex:1;height:44px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:1.05rem;background:var(--panel-2);color:var(--ink-3);border:1.5px solid var(--line);position:relative}
.meso .disc.past{background:color-mix(in srgb,var(--blue) 18%,var(--panel-2));color:var(--ink-2);border-color:transparent}
.meso .disc.now{background:var(--blue);color:var(--on-accent);border-color:var(--blue)}
.meso .disc.deload{border-style:dashed}
.meso .disc.deload.now{background:var(--yellow);border-color:var(--yellow);color:#1b1b1b;border-style:solid}
.meso .disc small{position:absolute;bottom:-18px;font-family:var(--f-body);font-size:.7rem;font-weight:600;color:var(--ink-3);white-space:nowrap}

/* ---------- Hoy ---------- */
.hero-next{background:var(--ink);color:var(--bg);border-radius:var(--r-l);padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.hero-next .k{font-size:.9rem;opacity:.75}
.hero-next h2{font-size:2.6rem;margin:2px 0 6px;color:var(--bg)}
.hero-next .meta{opacity:.8;font-size:.95rem}
.hero-next .plates{position:absolute;right:-30px;top:50%;transform:translateY(-50%);display:flex;gap:4px;opacity:.9;pointer-events:none}
.hero-next .plates i{display:block;border-radius:6px;width:16px}
.hero-next .btn.primary{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.daypick{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.daypick button{text-align:left;padding:12px;border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--panel)}
.daypick button b{display:block;font-family:var(--f-num);font-size:1.1rem}
.daypick button span{font-size:.82rem;color:var(--ink-2)}
.daypick button[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset}
.weekdots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.weekdots div{font-size:.75rem;color:var(--ink-3);font-weight:600}
.weekdots i{display:block;margin:4px auto 0;width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}
.weekdots i.ok{background:var(--green);border-color:var(--green)}
.weekdots i.mid{background:var(--yellow);border-color:var(--yellow)}
.weekdots i.low{background:var(--red);border-color:var(--red)}
.weekdots i.miss{border-color:var(--red);border-style:dashed}
.weekdots i.today{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--blue)}

/* ---------- Logger ---------- */
.sess-head{position:sticky;top:62px;z-index:20;background:var(--bg);padding:10px 0 12px;margin-bottom:6px}
.sess-head .row{flex-wrap:wrap}
.progressbar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden;margin-top:10px;border:1px solid var(--line)}
.progressbar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.ex{background:var(--panel);border-radius:var(--r-l);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.ex-top{display:flex;gap:12px;padding:14px 14px 10px;align-items:flex-start}
.plate{--c:var(--line);flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);border:5px solid var(--c);position:relative;font-family:var(--f-num);font-weight:700;font-size:1.05rem}
.plate::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--c);top:50%;left:50%;transform:translate(-50%,-50%);display:none}
.plate.ok{--c:var(--green);background:var(--green-soft)}
.plate.parcial{--c:var(--yellow);background:var(--yellow-soft)}
.plate.no{--c:var(--red);background:var(--red-soft)}
.ex-title{flex:1;min-width:0}
.ex-title h3{font-size:1.25rem;margin:0}
.ex-title .grp{font-size:.82rem;color:var(--ink-3);font-weight:600}
.ex-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:.8rem;font-weight:600;padding:2px 8px;border-radius:7px;background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.tag.b{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.tag.y{background:var(--yellow-soft);color:color-mix(in srgb,var(--yellow) 55%,var(--ink));border-color:transparent}
.tag.g{background:var(--green-soft);color:var(--green);border-color:transparent}
.tag.r{background:var(--red-soft);color:var(--red);border-color:transparent}
.ex-hint{margin:0 14px 10px;padding:10px 12px;border-radius:var(--r-s);background:var(--panel-2);font-size:.9rem;color:var(--ink-2)}
.ex-hint b{color:var(--ink)}
.ex-hint .sug{display:block;margin-top:4px;color:var(--ink)}
.warm{margin:0 14px 10px}
.warm summary{font-size:.88rem;font-weight:700;color:var(--ink-2);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}
.warm summary::-webkit-details-marker{display:none}
.warm summary::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s}
.warm[open] summary::before{transform:rotate(45deg)}
.warm-body{padding-top:8px}
.warm-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wchip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;border:1.5px solid var(--line);font-size:.9rem;font-weight:600;background:var(--panel)}
.wchip[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.sets{padding:0 10px 6px}
.sets-head,.set{display:grid;grid-template-columns:30px 1fr 1fr 64px 48px;gap:6px;align-items:center}
.sets-head{font-size:.75rem;font-weight:700;color:var(--ink-3);padding:0 4px 4px;text-align:center}
.set{padding:4px;border-radius:12px}
.set .n{font-family:var(--f-num);font-weight:700;text-align:center;color:var(--ink-3);font-size:1.05rem}
.set input{text-align:center;font-family:var(--f-num);font-size:1.3rem;font-weight:600;padding:8px 4px;height:46px}
.set input::placeholder{color:var(--ink-3);opacity:.7}
.set .chk{height:46px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;background:var(--panel)}
.set .chk svg{width:22px;height:22px;opacity:.25}
.set.done{background:var(--green-soft)}
.set.done .chk{background:var(--green);border-color:var(--green);color:#fff}
.set.done .chk svg{opacity:1}
.set.low .n{color:var(--red)}
.ex-foot{display:flex;gap:6px;flex-wrap:wrap;padding:6px 14px 14px}
.ex.skipped .sets,.ex.skipped .warm,.ex.skipped .ex-hint{opacity:.4;pointer-events:none}
.ex-note{margin:0 14px 12px}
.rounds{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 10px}
.round{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);font-family:var(--f-num);font-weight:700;font-size:1.1rem;background:var(--panel)}
.round[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}

/* ---------- Timer ---------- */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);z-index:45;
  background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 6px 6px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px -8px rgba(0,0,0,.5);width:min(440px,calc(100% - 32px))}
.timer[hidden]{display:none}
.timer .t{font-family:var(--f-num);font-weight:700;font-size:1.7rem;min-width:70px}
.timer .lbl{font-size:.85rem;opacity:.8;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer button{height:40px;padding:0 12px;border-radius:999px;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);font-weight:700;font-size:.9rem}
.timer .bar{position:absolute;left:18px;right:18px;bottom:3px;height:3px;border-radius:3px;background:color-mix(in srgb,var(--bg) 20%,transparent);overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--yellow)}
.timer.ending{background:var(--red)}

/* ---------- Calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:.75rem;color:var(--ink-3);text-align:center;font-weight:700;padding-bottom:4px}
.cal button{aspect-ratio:1;border-radius:12px;background:var(--panel-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--f-num);font-weight:600;font-size:1.05rem;border:2px solid transparent;position:relative}
.cal button.out{opacity:.35}
.cal button.today{border-color:var(--blue)}
.cal button.sel{background:var(--ink);color:var(--bg)}
.cal button .dots{display:flex;gap:3px;height:8px}
.cal button .dots i{width:8px;height:8px;border-radius:50%}
.cal button.miss::after{content:"";position:absolute;inset:4px;border:1.5px dashed var(--red);border-radius:9px;opacity:.7}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--ink-2);margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.sess-item{display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--r-m);background:var(--panel-2);margin-top:8px}
.sess-item .plate{width:46px;height:46px;font-size:.95rem;border-width:4px}

/* ---------- Stats ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border-radius:var(--r-m);padding:14px;box-shadow:var(--shadow)}
.kpi b{display:block;font-family:var(--f-num);font-size:2.1rem;font-weight:700;line-height:1}
.kpi span{font-size:.85rem;color:var(--ink-2)}
.vbar{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;font-size:.9rem;padding:5px 0}
.vbar .track{height:14px;border-radius:7px;background:var(--panel-2);overflow:hidden;position:relative;border:1px solid var(--line)}
.vbar .track i{display:block;height:100%;border-radius:7px}
.vbar .v{font-family:var(--f-num);font-weight:700;text-align:right;font-size:1.05rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.78rem;color:var(--ink-3);font-weight:700;padding:6px 6px;border-bottom:1.5px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tablewrap{overflow-x:auto;margin:0 -4px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--f-num);font-size:13px;fill:var(--ink-3)}
.chart .lbl{fill:var(--ink);font-weight:700;font-size:15px}
.pr{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}

/* ---------- Routine editor ---------- */
.day-acc{background:var(--panel);border-radius:var(--r-l);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.day-acc>summary{display:flex;align-items:center;gap:12px;padding:16px;cursor:pointer;list-style:none}
.day-acc>summary::-webkit-details-marker{display:none}
.day-acc>summary .dn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-family:var(--f-num);font-weight:700;font-size:1.1rem;flex:none}
.day-acc>summary h3{margin:0}
.exrow{display:flex;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.exrow .info{flex:1;min-width:0}
.exrow .info b{display:block}
.exrow .info span{font-size:.85rem;color:var(--ink-2)}
.exrow .acts{display:flex;gap:2px}
.exrow .acts .iconbtn{width:34px;height:34px}
.exrow .acts svg{width:18px;height:18px}
.guide dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.95rem}
.guide dt{font-family:var(--f-num);font-weight:700;font-size:1.15rem}
.guide p,.guide li{font-size:.95rem;color:var(--ink-2)}
.guide ul{padding-left:18px}
.guide li+li{margin-top:4px}
.guide h4{font-size:1rem;margin:14px 0 6px}
.wtable{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;border:1.5px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.wtable div{padding:8px 4px;border-bottom:1px solid var(--line);font-size:.9rem}
.wtable div:nth-last-child(-n+4){border-bottom:0}
.wtable .h{font-weight:700;background:var(--panel-2);font-size:.8rem;color:var(--ink-2)}
.wtable .big{font-family:var(--f-num);font-size:1.3rem;font-weight:700}

/* ---------- Dialog / toast ---------- */
dialog{border:0;border-radius:var(--r-l);background:var(--panel);color:var(--ink);width:min(560px,calc(100% - 24px));max-height:calc(100dvh - 40px);padding:0;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);margin:auto}
dialog::backdrop{background:rgba(10,14,20,.55)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dlg-b{padding:18px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel);flex-wrap:wrap}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%) translateY(-12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.92rem;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.summary-big{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.summary-big .plate{width:84px;height:84px;font-size:1.6rem;border-width:8px}

@media (max-width:520px){
  h2{font-size:1.5rem}
  .hero-next h2{font-size:2.1rem}
  .vbar{grid-template-columns:92px 1fr 48px}
  .sets-head,.set{grid-template-columns:24px 1fr 1fr 56px 46px;gap:5px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
"use strict";
/* ============================================================
   1. CATÁLOGOS (contenido de entrenamiento)
   ============================================================ */

// Volumen semanal objetivo (series efectivas). Viene de la hoja VOLUMEN.
// "D. posterior" es agregado: el ejercicio posterior en máquina no se contaba en ningún grupo.
const MUSCLES = {
  pecho:{n:'Pecho',t:6}, espalda:{n:'Espalda',t:12}, cuadriceps:{n:'Cuádriceps',t:14},
  isquios:{n:'Isquiosurales',t:6}, gluteos:{n:'Glúteos',t:6}, deltoides:{n:'Deltoides',t:6},
  d_medial:{n:'D. medial',t:3}, d_posterior:{n:'D. posterior',t:3}, biceps:{n:'Bíceps',t:6},
  triceps:{n:'Tríceps',t:6}, pantorrillas:{n:'Pantorrillas',t:8}, abs:{n:'Abdomen',t:9},
  trapecios:{n:'Trapecios',t:0}, antebrazos:{n:'Antebrazos',t:0}, cardio:{n:'Cardio',t:0}
};

// Series de aproximación (hoja INSTRUCCIONES)
const WARMUP = [{p:.5,r:12},{p:.7,r:8},{p:.9,r:4}];

const RIR_TXT = {5:'5 repeticiones en reserva',4:'4 repeticiones en reserva',3:'3 repeticiones en reserva',2:'2 repeticiones en reserva',1:'1 repetición en reserva',0:'Fallo total'};

const PLATE_COLORS = ['#CF2338','#1F5FC4','#E2A800','#1F8C55','#7A4FD6','#E0662B','#1595A6','#4B5966'];

let _id = 0;
function ex(group, muscle, name, type, approach, sets, repMin, repMax, rest, restLabel, rir, extra){
  return Object.assign({id:'e'+(++_id), group, muscle, name, type, mode:'fuerza', approach, sets, repMin, repMax, rest, restLabel, rir, note:''}, extra||{});
}
function cardio(name, kind, extra){
  return Object.assign({id:'e'+(++_id), group:'Cardio', muscle:'cardio', name, type:'cardio', mode:'cardio', kind, approach:0, sets:0, repMin:0, repMax:0, rest:0, restLabel:'', rir:'', note:''}, extra);
}

// Rutina base: hoja RUTINA (Torso/pierna + descanso activo, 5 días, mesociclo de 5 semanas con descarga)
function templateRoutine(){
  _id = 0;
  const hiit = () => cardio('Cardio HIIT','hiit',{warmMin:5, rounds:5, work:60, easy:60, note:'5 min de calentamiento suave, luego 5 rondas: 60 s fuerte / 60 s suave.'});
  return [
    {id:'d1', name:'Tren inferior A', short:'Inferior A', exercises:[
      ex('Pantorrilla','pantorrillas','Elevación de talones en máquina','aislamiento',1,4,15,20,60,'1 min','0-1',{note:'Pausa 1 s abajo en estiramiento completo.'}),
      ex('Pierna','cuadriceps','Sentadilla hack','compuesto',3,4,8,10,210,'3-4 min','1-2'),
      ex('Pierna','isquios','Femoral acostado','aislamiento',1,3,10,12,150,'2-3 min','0-1'),
      ex('Glúteo','gluteos','Hip thrust en máquina','compuesto',0,3,8,10,180,'3 min','0-2',{note:'Pausa de 1 s arriba apretando glúteo.'}),
      ex('Pierna','cuadriceps','Sentadilla búlgara','compuesto',0,4,10,12,90,'90 s por pierna','1-2',{note:'Reps por pierna. Registra el peso por mancuerna.'}),
      hiit()
    ]},
    {id:'d2', name:'Tren superior A', short:'Superior A', exercises:[
      ex('Espalda','espalda','Jalón al pecho con agarre abierto','compuesto',3,3,8,10,180,'3 min','1-2'),
      ex('Espalda','espalda','Remo sentado con agarre al hombro','compuesto',1,3,10,12,180,'3 min','0-1'),
      ex('Pecho','pecho','Press inclinado con mancuernas','compuesto',3,3,10,12,180,'3 min','1-2',{note:'Registra el peso por mancuerna.'}),
      ex('Hombro','deltoides','Press militar con mancuernas','compuesto',0,3,10,12,150,'2-3 min','1-2'),
      ex('Hombro','d_medial','Elevaciones laterales en polea','aislamiento',0,3,12,15,90,'90 s','0-2'),
      ex('Bíceps','biceps','Curl en banco inclinado con mancuernas','aislamiento',0,3,10,12,120,'2 min','0-1'),
      ex('Tríceps','triceps','Extensión de tríceps en polea alta','aislamiento',0,3,12,15,120,'2 min','0-1'),
      ex('Abdomen','abs','Crunches en banco declinado','aislamiento',0,3,12,15,120,'2 min','0-2')
    ]},
    {id:'d3', name:'Descanso activo', short:'Activo', exercises:[
      ex('Abdomen','abs','Planchas','aislamiento',0,3,30,60,120,'2 min','0-1',{mode:'tiempo',note:'Reps = segundos sosteniendo. Glúteo y abdomen apretados, sin hundir la cadera.'}),
      cardio('Cardio LISS','liss',{minutes:60, note:'60 min a intensidad conversable (caminadora inclinada, bici o elíptica).'})
    ]},
    {id:'d4', name:'Tren inferior B', short:'Inferior B', exercises:[
      ex('Pantorrilla','pantorrillas','Elevación de talones en máquina','aislamiento',1,4,12,15,60,'1 min','0-1'),
      ex('Pierna','isquios','Peso muerto rumano con barra','compuesto',3,3,8,10,180,'3 min','1-2',{note:'Cadera atrás, espalda neutra, barra pegada a las piernas.'}),
      ex('Pierna','cuadriceps','Prensa','compuesto',3,3,10,12,180,'3 min','1-2'),
      ex('Glúteo','gluteos','Patadas de glúteo en polea','aislamiento',0,3,12,15,120,'2 min','0-2',{note:'Reps por pierna.'}),
      ex('Pierna','cuadriceps','Extensión de piernas','aislamiento',0,2,12,15,150,'2-3 min','0-1'),
      ex('Pierna','cuadriceps','Sentadilla frontal con mancuerna','compuesto',0,1,15,20,0,'—','1-2',{note:'Serie final de bombeo, sin descanso programado.'}),
      hiit()
    ]},
    {id:'d5', name:'Tren superior B', short:'Superior B', exercises:[
      ex('Hombro','deltoides','Press militar en máquina','compuesto',3,3,10,12,180,'3 min','1-2'),
      ex('Hombro','d_posterior','Posterior unilateral en máquina','aislamiento',0,3,12,15,120,'2 min','0-1',{note:'Reps por brazo.'}),
      ex('Espalda','espalda','Remo en máquina con agarre abierto','compuesto',3,3,8,10,180,'3 min','1-2'),
      ex('Espalda','espalda','Pullover en polea alta','aislamiento',1,3,12,15,150,'2-3 min','0-1'),
      ex('Pecho','pecho','Aperturas de pecho en máquina','aislamiento',1,3,12,15,120,'2 min','0-2'),
      ex('Tríceps','triceps','Extensión por encima de la cabeza en polea','aislamiento',0,3,10,12,120,'2 min','0-1'),
      ex('Bíceps','biceps','Curl predicador en máquina','aislamiento',0,3,12,15,120,'2 min','0-1'),
      ex('Abdomen','abs','Abdomen en polea alta','aislamiento',0,3,15,20,120,'2 min','0-2')
    ]}
  ];
}

/* ============================================================
   2. ESTADO Y PERSISTENCIA
   ============================================================ */
const LS_KEY = 'bitacora-gym.v1';
const UI_KEY = 'bitacora-gym.ui';
let S;
const ui = {tab:'hoy', calMonth:null, selDate:null, pickDay:null, pickWeek:null, progEx:null, progMetric:'e1rm', volWeek:0, bodyMetric:'weight', openDay:null};

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function newProfile(name, color, info, id){
  return {id:id||uid(), _m:0, deletedIds:[], name, color, info:Object.assign({edad:'',tiempo:'',frecuencia:5,rutina:'Torso/pierna + descanso activo',enfasis:'',notas:''},info||{}),
    cycleStart:iso(mondayOf(new Date())), trainingDays:[1,2,3,4,5], routine:templateRoutine(), targets:Object.fromEntries(Object.entries(MUSCLES).map(([k,v])=>[k,v.t])),
    sessions:[], body:[]};
}
function freshState(){
  // ids fijos: si dos teléfonos arrancan desde cero, se combinan en el mismo perfil
  const diana = newProfile('Diana', PLATE_COLORS[0], {edad:'22 años', tiempo:'2 años', frecuencia:5, enfasis:'Reducción de porcentaje de grasa'}, 'p-diana');
  const yo = newProfile('Yo', PLATE_COLORS[1], {}, 'p-yo');
  return {v:1, active:diana.id, theme:'auto', profiles:[diana, yo]};
}
function load(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw){ S = JSON.parse(raw); } }catch(e){}
  normalize();
  initLocalHashes();
  persistLocal();
  try{ Object.assign(ui, JSON.parse(localStorage.getItem(UI_KEY)||'{}')); }catch(e){}
}
function normalize(){
  if(!S || !Array.isArray(S.profiles) || !S.profiles.length){ const keep = S && S.theme; S = freshState(); if(keep) S.theme = keep; }
  S.theme ||= 'auto';
  S.profiles.forEach(p=>{ p.sessions ||= []; p.body ||= []; p.targets ||= Object.fromEntries(Object.entries(MUSCLES).map(([k,v])=>[k,v.t])); p.trainingDays ||= [1,2,3,4,5]; p.deletedIds ||= []; p._m ||= 0; });
  if(!S.profiles.find(p=>p.id===S.active)) S.active = S.profiles[0].id;
}
let saveWarned = false;
// Guarda en el teléfono al instante y programa la sincronización con la nube
function save(){ stampChanges(); persistLocal(); scheduleSync(); }
function persistLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch(e){ if(!saveWarned){ saveWarned = true; toast('Este teléfono no está guardando localmente. Revisa el espacio del navegador.'); } }
  saveSM();
}

/* ============================================================
   2b. SINCRONIZACIÓN CON CLOUDFLARE (D1)
   ------------------------------------------------------------
   Cada perfil es un documento. Se guarda primero en el teléfono
   (funciona sin señal en el gym) y luego se sube a /api.
   Si otro teléfono subió algo más nuevo, se combinan: las sesiones
   y medidas se unen por id y gana la edición más reciente.
   ============================================================ */
const SYNC_KEY = 'bitacora-gym.sync', PIN_KEY = 'bitacora-gym.pin';
let SM = {};
try{ SM = JSON.parse(localStorage.getItem(SYNC_KEY)||'{}'); }catch(e){}
SM.profiles ||= {}; SM.deletes ||= [];
function saveSM(){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify(SM)); }catch(e){} }
const getPin = () => { try{ return localStorage.getItem(PIN_KEY)||''; }catch(e){ return ''; } };
function hash(str){ let h = 0x811c9dc5; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h>>>0).toString(36)+'.'+str.length; }
const meta = id => (SM.profiles[id] ||= {base:0, hash:'', local:''});
const isDirty = p => meta(p.id).hash !== hash(JSON.stringify(p));
function initLocalHashes(){ S.profiles.forEach(p=> meta(p.id).local = hash(JSON.stringify(p))); }
function stampChanges(){
  const now = Date.now();
  S.profiles.forEach(p=>{
    const m = meta(p.id);
    if(hash(JSON.stringify(p)) === m.local) return;
    p._m = now;
    const live = p.sessions.find(s=>s.status==='live'); if(live) live._m = now;
    m.local = hash(JSON.stringify(p));
  });
}
function mergeList(a, b, dead){
  const m = new Map();
  [...(a||[]), ...(b||[])].forEach(it=>{ if(!it || dead.has(it.id)) return; const c = m.get(it.id); if(!c || (it._m||0) > (c._m||0)) m.set(it.id, it); });
  return [...m.values()];
}
function mergeProfile(local, remote){
  const dead = new Set([...(local.deletedIds||[]), ...(remote.deletedIds||[])]);
  const base = (local._m||0) >= (remote._m||0) ? local : remote;
  return {...base, deletedIds:[...dead].slice(-1000), sessions:mergeList(local.sessions, remote.sessions, dead), body:mergeList(local.body, remote.body, dead)};
}

let syncState = location.protocol==='file:' ? 'local' : 'idle', syncBusy = false, syncTimer = null, pendingRender = false;
const SYNC_TXT = {ok:'Sincronizado', saving:'Guardando…', idle:'Conectando…', offline:'Sin conexión: guardado en el teléfono', local:'Solo en este teléfono', pin:'Falta el PIN', nodb:'Falta configurar la base de datos'};
function setSync(st){ syncState = st; const d = $('#syncDot'); if(d){ d.dataset.s = st; d.title = SYNC_TXT[st]; d.setAttribute('aria-label', 'Sincronización: '+SYNC_TXT[st]); } const t = $('#syncTxt'); if(t) t.textContent = SYNC_TXT[st]; }
async function api(method, path, body){
  try{
    const r = await fetch('/api/'+path, {method, cache:'no-store', headers:{'content-type':'application/json','x-pin':getPin()}, body: body ? JSON.stringify(body) : undefined});
    let data = null; try{ data = await r.json(); }catch(e){}
    return {status:r.status, data};
  }catch(e){ return {status:0, data:null}; }
}
// true si se puede seguir; si no, actualiza el estado
function okStatus(r){
  if(r.status===200 || r.status===409) return true;
  if(r.status===0) setSync('offline');
  else if(r.status===401) setSync('pin');
  else if(r.status===503 && r.data && r.data.error==='no-db') setSync('nodb');
  else if(!r.data) setSync('local');          // hosting sin funciones
  else setSync('offline');
  return false;
}
function softRender(){
  const a = document.activeElement;
  if(dlg.open || (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))){ pendingRender = true; return; }
  pendingRender = false; render();
}
document.addEventListener('focusout', ()=> setTimeout(()=>{ if(pendingRender) softRender(); }, 50));
function scheduleSync(){ if(syncState==='local' && location.protocol==='file:') return; clearTimeout(syncTimer); syncTimer = setTimeout(()=>sync(), 1200); }

async function sync(){
  if(location.protocol==='file:') return;
  if(syncBusy){ scheduleSync(); return; }
  syncBusy = true;
  try{ if(await pull()) await push(); }
  finally{ syncBusy = false; }
}
async function pull(){
  const r = await api('GET','state');
  if(!okStatus(r)) return false;
  let changed = false;
  for(const sp of r.data.profiles){
    const i = S.profiles.findIndex(p=>p.id===sp.id);
    const m = meta(sp.id);
    if(sp.updated_at <= m.base) continue;
    if(sp.deleted){
      if(i>=0){ S.profiles.splice(i,1); changed = true; }
      delete SM.profiles[sp.id]; continue;
    }
    const merged = i>=0 && isDirty(S.profiles[i]) ? mergeProfile(S.profiles[i], sp.data) : sp.data;
    if(i>=0) S.profiles[i] = merged; else S.profiles.push(merged);
    m.base = sp.updated_at; m.hash = hash(JSON.stringify(sp.data)); m.local = hash(JSON.stringify(merged));
    changed = true;
  }
  if(changed){ normalize(); persistLocal(); softRender(); }
  return true;
}
async function push(){
  for(const id of [...SM.deletes]){
    const r = await api('DELETE','profiles/'+encodeURIComponent(id));
    if(!okStatus(r)) return;
    SM.deletes = SM.deletes.filter(x=>x!==id); delete SM.profiles[id]; saveSM();
  }
  for(const p0 of [...S.profiles]){
    for(let attempt=0; attempt<3; attempt++){
      const p = S.profiles.find(x=>x.id===p0.id); if(!p || !isDirty(p)) break;
      setSync('saving');
      const sent = JSON.stringify(p);
      const r = await api('PUT','profiles/'+encodeURIComponent(p.id), {data:p, base:meta(p.id).base});
      if(r.status===409){
        const d = r.data, m = meta(p.id), i = S.profiles.findIndex(x=>x.id===p.id);
        const merged = d.deleted ? p : mergeProfile(S.profiles[i], d.data);
        S.profiles[i] = merged; m.base = d.updated_at; m.hash = d.deleted ? '' : hash(JSON.stringify(d.data)); m.local = hash(JSON.stringify(merged));
        persistLocal(); softRender(); continue;
      }
      if(!okStatus(r)) return;
      const m = meta(p.id); m.base = r.data.updated_at; m.hash = hash(sent); saveSM();
      break;
    }
  }
  setSync(S.profiles.some(isDirty) ? 'saving' : 'ok');
  if(S.profiles.some(isDirty)) scheduleSync();
}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function mondayOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const w = (x.getDay()+6)%7; x.setDate(x.getDate()-w); return x; }
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
const daysBetween = (a,b) => Math.round((parseISO(b)-parseISO(a))/864e5);
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DOW = ['L','M','X','J','V','S','D'];
const DOW_LONG = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function fmtDate(s, long){ const d = parseISO(s); return long ? `${DOW_LONG[d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]}` : `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; }
const num = v => { if(v===''||v==null) return null; const n = parseFloat(String(v).replace(',','.')); return isNaN(n)?null:n; };
const fmtN = (n,d=1) => n==null ? '—' : (Math.round(n*10**d)/10**d).toLocaleString('es-MX');
const roundTo = (w, step) => Math.round(w/step)*step;
const roundLoad = w => w >= 20 ? roundTo(w,2.5) : roundTo(w,1);
const e1rm = (w,r) => (w>0 && r>0) ? w*(1+r/30) : 0;          // Epley
function parseRir(s){ const m = String(s||'').match(/(\d+)\s*-\s*(\d+)/); if(m) return [+m[1],+m[2]]; const n = parseInt(s); return isNaN(n)?null:[n,n]; }
const fmtRest = s => !s ? '—' : s<60 ? s+' s' : (s%60? Math.floor(s/60)+':'+pad(s%60) : s/60+' min');
const fmtClock = s => Math.floor(s/60)+':'+pad(Math.max(0,s%60));
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2600); }

/* ============================================================
   4. LÓGICA DE ENTRENAMIENTO
   ============================================================ */
// Semana del mesociclo (1-4 trabajo, 5 descarga) según fecha de inicio
function cycleInfo(p, dateStr){
  const d = daysBetween(p.cycleStart, dateStr || iso(new Date()));
  const w = Math.floor(d/7);
  return {week: ((w%5)+5)%5 + 1, cycle: Math.floor(w/5)+1, before: d<0};
}
const isDeload = w => w === 5;
function plannedSets(e, week){
  if(e.mode==='cardio') return e.kind==='hiit' ? (isDeload(week) ? 3 : e.rounds) : 1;
  return isDeload(week) ? Math.max(1, Math.ceil(e.sets/2)) : e.sets;
}
const targetRir = (e, week) => isDeload(week) ? '3-4' : e.rir;
const allEx = p => p.routine.flatMap(d=>d.exercises.map(e=>({...e, dayId:d.id, dayName:d.short||d.name})));
const findEx = (p, id) => allEx(p).find(e=>e.id===id);
const liveSession = p => p.sessions.find(s=>s.status==='live');
const doneSessions = p => p.sessions.filter(s=>s.status==='done').sort((a,b)=> (a.date+a.startedAt).localeCompare(b.date+b.startedAt));

// Evalúa un ejercicio de una sesión → ok | parcial | no | pend
function evalEntry(e, en, week, live){
  const planned = en.planned ?? plannedSets(e, week);
  if(en.skipped) return {status:'no', done:0, planned};
  if(e.mode==='cardio'){
    if(e.kind==='hiit'){ const d = (en.rounds||[]).filter(Boolean).length; return {status: d>=planned?'ok': d>0?'parcial': live?'pend':'no', done:d, planned}; }
    const m = num(en.minutes)||0, t = e.minutes||60;
    const st = en.cdone || m>=t ? 'ok' : m>0 ? 'parcial' : live ? 'pend' : 'no';
    return {status:st, done: st==='ok'?1:0, planned:1};
  }
  const done = en.sets.filter(s=>s.done);
  const good = done.filter(s=>(num(s.r)||0) >= e.repMin);
  let status;
  if(!done.length) status = live ? 'pend' : 'no';
  else if(done.length >= planned && good.length >= planned) status = 'ok';
  else status = 'parcial';
  return {status, done:done.length, planned};
}
const STATUS_TXT = {ok:'Cumplido', parcial:'Parcial', no:'No cumplido', pend:'Pendiente'};
const STATUS_TAG = {ok:'g', parcial:'y', no:'r', pend:''};
const SCORE = {ok:1, parcial:.5, no:0, pend:0};

function sessionScore(p, s){
  const day = p.routine.find(d=>d.id===s.dayId);
  let tot=0, sc=0;
  s.entries.forEach(en=>{ const e = en.snap; if(!e) return; const r = evalEntry(e, en, s.week, s.status==='live'); tot++; sc += SCORE[r.status]; });
  return tot ? Math.round(sc/tot*100) : 0;
}
function sessionVolume(s){ return s.entries.reduce((a,en)=> a + (en.snap.mode==='fuerza' ? en.sets.filter(x=>x.done).reduce((b,x)=> b + (num(x.w)||0)*(num(x.r)||0), 0) : 0), 0); }
const scoreClass = pc => pc>=85 ? 'ok' : pc>=50 ? 'parcial' : 'no';
const scoreColor = pc => pc>=85 ? 'var(--green)' : pc>=50 ? 'var(--yellow)' : 'var(--red)';

// Historial de un ejercicio (sesiones terminadas)
function exHistory(p, exId, excludeSessionId){
  return doneSessions(p).filter(s=>s.id!==excludeSessionId).map(s=>{
    const en = s.entries.find(x=>x.exId===exId); if(!en || en.skipped) return null;
    return {s, en};
  }).filter(Boolean);
}
function lastPerformance(p, exId, excludeId){
  const h = exHistory(p, exId, excludeId).filter(x=> x.en.snap.mode==='cardio' || x.en.sets.some(s=>s.done));
  return h.length ? h[h.length-1] : null;
}
function lastWorkPerformance(p, exId, excludeId){  // ignora semanas de descarga para progresar
  const h = exHistory(p, exId, excludeId).filter(x=> !isDeload(x.s.week) && x.en.sets && x.en.sets.some(s=>s.done));
  return h.length ? h[h.length-1] : null;
}

// Recomendación de progresión (hoja PROGRESIONES):
// compuestos → subir carga/intensidad; aislamiento → subir reps/volumen
function suggestion(p, e, week, excludeId){
  if(e.mode==='cardio'){
    if(e.kind==='hiit') return {txt: isDeload(week) ? 'Descarga: 3 rondas en lugar de 5.' : 'Si las 5 rondas se sienten fáciles, sube velocidad o inclinación en los 60 s fuertes.'};
    return {txt:'Intensidad conversable: puedes hablar en frases completas. Cuenta también como pasos del día.'};
  }
  const last = lastWorkPerformance(p, e.id, excludeId);
  const rr = parseRir(targetRir(e,week));
  if(!last) return {txt:`Primera vez: busca una carga con la que termines en ${e.repMin}–${e.repMax} ${e.mode==='tiempo'?'s':'reps'} dejando ${rr?rr.join('–'):'1–2'} en reserva. Anótala y la próxima vez te digo cuánto subir.`, w:null};
  const sets = last.en.sets.filter(s=>s.done);
  const reps = sets.map(s=>num(s.r)||0), ws = sets.map(s=>num(s.w)||0);
  const top = Math.max(...ws);
  const rirs = sets.map(s=>num(s.rir)).filter(v=>v!=null);
  const avgRir = rirs.length ? rirs.reduce((a,b)=>a+b,0)/rirs.length : null;
  const plannedW = last.en.planned ?? e.sets;
  const allTop = sets.length>=plannedW && reps.every(r=>r>=e.repMax);
  const anyLow = reps.some(r=>r<e.repMin);
  const easy = rr && avgRir!=null && avgRir > rr[1]+1;
  const tooHard = rr && avgRir!=null && avgRir < rr[0];
  const unit = e.mode==='tiempo' ? 's' : 'reps';

  if(isDeload(week)){
    return {txt:`Semana de descarga: ${plannedSets(e,week)} series, baja ~10% (≈${fmtN(roundLoad(top*.9))} kg) y quédate en RIR 3–4. Es para recuperar, no para buscar récords.`, w: top? roundLoad(top*.9): null};
  }
  if(e.mode==='tiempo'){
    if(allTop) return {txt:`Llegaste a ${e.repMax} s en todas: suma un disco en la espalda o pasa a una variante más difícil.`, w:top||null};
    return {txt:`Suma 5 s por serie hasta llegar a ${e.repMax} s en todas.`, w:top||null};
  }
  if(e.type==='compuesto'){
    const inc = top>=40 ? 5 : 2.5;
    if(allTop || easy) return {txt:`${allTop?'Tocaste el tope del rango en todas las series':'Te sobró energía (RIR alto)'}: sube a ${fmtN(top+inc)} kg (+${inc}) y vuelve a empezar desde ${e.repMin} reps.`, w: top+inc, up:true};
    if(anyLow) return {txt:`Alguna serie quedó bajo ${e.repMin} reps. Mantén ${fmtN(top)} kg; si vuelve a pasar, baja 5–10%.${tooHard?' Además fuiste más cerca del fallo de lo planeado.':''}`, w: top};
    return {txt:`Mantén ${fmtN(top)} kg y busca +1 rep en al menos una serie. Cuando llegues a ${e.repMax} en todas, subes carga.`, w: top};
  }
  // aislamiento
  if(allTop) return {txt:`${e.repMax} ${unit} en todas: sube la carga mínima posible (siguiente placa/bloque) y regresa a ${e.repMin} reps.`, w: top + (top>=20?2.5:1), up:true};
  if(anyLow) return {txt:`Mantén ${fmtN(top)} kg y prioriza llegar a ${e.repMin} reps con buena técnica.`, w: top};
  return {txt:`Misma carga (${fmtN(top)} kg), suma 1–2 reps por serie. Aquí se progresa en repeticiones antes que en peso.`, w: top};
}

function nextDay(p){
  const done = doneSessions(p);
  if(!done.length) return p.routine[0];
  const last = done[done.length-1];
  const i = p.routine.findIndex(d=>d.id===last.dayId);
  return p.routine[(i+1) % p.routine.length] || p.routine[0];
}

function mesoStrip(week){
  return `<div class="meso" aria-label="Semana ${week} de 5 del mesociclo">${[1,2,3,4,5].map(w=>`<div class="disc ${w<week?'past':''} ${w===week?'now':''} ${w===5?'deload':''}">${w===5?'D':'S'+w}${w===5?'<small>Descarga</small>':''}</div>`).join('')}</div>`;
}
function weekDots(p){
  const mon = mondayOf(new Date()), today = iso(new Date());
  const ds = doneSessions(p);
  return `<div class="weekdots">${[0,1,2,3,4,5,6].map(i=>{
    const d = iso(addDays(mon,i)); const ss = ds.filter(s=>s.date===d);
    let cls = '';
    if(ss.length){ cls = {ok:'ok',parcial:'mid',no:'low'}[scoreClass(Math.max(...ss.map(s=>sessionScore(p,s))))]; }
    else if(ds.length && d<today && p.trainingDays.includes((i+1)%7) && d>=ds[0].date && d>=p.cycleStart) cls='miss';
    return `<div>${DOW[i]}<i class="${cls} ${d===today?'today':''}" title="${fmtDate(d,true)}"></i></div>`;}).join('')}</div>`;
}

    <div class="daypick" style="margin-top:12px">${p.routine.map((d,i)=>`<button data-act="pickDay" data-id="${d.id}" aria-pressed="${d.id===nd.id}"><b>Día ${i+1}</b><span>${esc(d.name)}</span></button>`).join('')}</div>

function exCard(p, s, en, i){
  const e = en.snap;
  const r = evalEntry(e, en, s.week, true);
  const live = s.status === 'live';

  const sug = suggestion(p, e, s.week, s.id);

  if(e.mode==='cardio'){

      body = `

      <div class="rounds">${Array.from({length:r.planned},(_,k)=>`<button class="round" data-act="toggleRound" data-i="${i}" data-k="${k}" aria-pressed="${!!(en.rounds||[])[k]}" aria-label="Ronda ${k+1}">${k+1}</button>`).join('')}</div>
      <div class="ex-foot"><button class="btn sm primary" data-act="hiitTimer" data-i="${i}">Iniciar intervalos ${e.work}/${e.easy} s</button></div>`;
    } else {
      body = `
      <div class="ex-hint">${esc(e.note)}<span class="sug">${esc(sug.txt)}</span></div>
      <div class="grid2" style="padding:0 14px 10px">
        <label class="f">Minutos (meta ${e.minutes||60})<input type="number" inputmode="numeric" data-bind="cardio" data-i="${i}" data-f="minutes" value="${esc(en.minutes)}" placeholder="${e.minutes||60}"></label>
        <label class="f">Máquina / tipo<input type="text" data-bind="cardio" data-i="${i}" data-f="kindTxt" value="${esc(en.kindTxt)}" placeholder="Caminadora 10% inclinación"></label>
      </div>
      <div class="ex-foot"><button class="btn sm ${en.cdone?'primary':''}" data-act="toggleCardio" data-i="${i}">${en.cdone?'Hecho':'Marcar como hecho'}</button></div>`;
    }
  } else {
    const unit = e.mode==='tiempo' ? 'seg' : 'reps';
    const lastTxt = last && last.en.sets ? last.en.sets.filter(x=>x.done).map(x=>`${x.w?fmtN(num(x.w))+'×':''}${x.r}`).join(' · ') : '';
    const work = num(en.warmW) ?? sug.w ?? (last ? Math.max(...last.en.sets.filter(x=>x.done).map(x=>num(x.w)||0)) : null);
    const warm = e.approach>0 && e.mode==='fuerza' ? `
      <details class="warm" ${en.warm && en.warm.some(Boolean) && !en.warm.every(Boolean) ? 'open':''}>
        <summary>Series de aproximación (${e.approach})</summary>
        <div class="warm-body">
          <div class="row" style="max-width:280px"><label class="f" style="flex:1">Carga de trabajo (kg)<input type="number" inputmode="decimal" data-bind="warmW" data-i="${i}" value="${esc(en.warmW)}" placeholder="${work?fmtN(work):'kg'}"></label></div>
          <div class="warm-chips" id="warm-${i}">${warmChips(e, en, i, work)}</div>
          <p class="faint" style="font-size:.82rem;margin-top:6px">15–30 s entre aproximaciones y 2–3 min antes de la primera serie de trabajo.</p>
        </div>
      </details>` : '';
    body = `

function startSession(dayId, week){
  const p = P();
  const day = p.routine.find(d=>d.id===dayId); if(!day) return;
  const ci = cycleInfo(p);
  const s = {id:uid(), date:iso(new Date()), startedAt:Date.now(), endedAt:null, status:'live', dayId, dayName:day.name, week:+week, cycle:ci.cycle, rpe:'', energy:'', sleep:'', notes:'',
    entries: day.exercises.map(e=>{
      const planned = plannedSets(e, +week);
      const snap = JSON.parse(JSON.stringify(e));
      const en = {exId:e.id, snap, planned, skipped:false, note:''};
      if(e.mode==='cardio'){ en.rounds = []; en.minutes=''; en.cdone=false; }
      else { en.sets = Array.from({length:planned}, ()=>({w:'',r:'',rir:'',done:false})); en.warm=[]; en.warmW=''; }
      return en;
    })};
  p.sessions.push(s);
  ui.pickDay = null; ui.pickWeek = null;
  save(); render(); window.scrollTo(0,0); requestWake();
}

function finishSession(){
  const p = P(), s = liveSession(p); if(!s) return;
  const anyDone = s.entries.some(en=> en.sets ? en.sets.some(x=>x.done) : (en.cdone || (en.rounds||[]).some(Boolean) || num(en.minutes)));
  if(!anyDone && !confirm('No marcaste ninguna serie. ¿Guardar la sesión de todos modos?')) return;
  // PRs antes de cerrar
  const prs = [];
  s.entries.forEach(en=>{
    if(!en.sets || en.snap.mode!=='fuerza') return;
    const best = Math.max(0,...en.sets.filter(x=>x.done).map(x=>e1rm(num(x.w)||0, num(x.r)||0)));
    if(!best) return;
    const prev = Math.max(0,...exHistory(p, en.exId, s.id).flatMap(h=>h.en.sets.filter(x=>x.done).map(x=>e1rm(num(x.w)||0,num(x.r)||0))));
    if(prev && best > prev) prs.push({name:en.snap.name, val:best, prev});
  });
  s.status = 'done'; s.endedAt = Date.now(); s._m = Date.now();
  save(); stopTimer(); releaseWake();
  showSummary(p, s, prs);
  render();
}

function viewCal(){
  const p = P();
  const now = new Date();
  const [y,m] = ui.calMonth ? ui.calMonth.split('-').map(Number) : [now.getFullYear(), now.getMonth()+1];
  const first = new Date(y, m-1, 1);
  const start = mondayOf(first);
  const today = iso(now);
  const ds = doneSessions(p);
  const byDate = {}; ds.forEach(s=>{ (byDate[s.date] ||= []).push(s); });
  const firstLog = ds.length ? ds[0].date : today;
  const missFrom = p.cycleStart > firstLog ? p.cycleStart : firstLog;   // nunca antes de la primera sesión
  let cells = '';
  for(let i=0;i<42;i++){
    const d = addDays(start,i), k = iso(d), out = d.getMonth()!==m-1;
    const ss = byDate[k]||[];
    const miss = !ss.length && k<today && k>=missFrom && p.trainingDays.includes(d.getDay());
    cells += `<button class="${out?'out':''} ${k===today?'today':''} ${k===ui.selDate?'sel':''} ${miss?'miss':''}" data-act="selDate" data-d="${k}" aria-label="${fmtDate(k,true)}${ss.length?', '+ss.length+' sesión':''}${miss?', faltó':''}">
      ${d.getDate()}<span class="dots">${ss.map(s=>`<i style="background:${scoreColor(sessionScore(p,s))}"></i>`).join('')}</span></button>`;
    if(i===34 && addDays(start,35).getMonth()!==m-1) break;
  }
  // estadísticas del mes
  const monthKey = `${y}-${pad(m)}`;
  const inMonth = ds.filter(s=>s.date.startsWith(monthKey));
  let planned = 0;
  for(let d=new Date(first); d.getMonth()===m-1; d=addDays(d,1)){ const k=iso(d); if(k<=today && k>=missFrom && p.trainingDays.includes(d.getDay())) planned++; }
  const daysWent = new Set(inMonth.map(s=>s.date)).size;
  const avg = inMonth.length ? Math.round(inMonth.reduce((a,s)=>a+sessionScore(p,s),0)/inMonth.length) : null;
  const sel = ui.selDate ? (byDate[ui.selDate]||[]) : [];
  return `
  <div class="view-head"><div><h2>Asistencia</h2><p>Días que fuiste y qué tanto cumpliste el plan.</p></div></div>
  <div class="kpis">
    <div class="kpi"><b class="num">${daysWent}</b><span>días entrenados en ${MONTHS[m-1]}</span></div>
    <div class="kpi"><b class="num">${planned?Math.min(100,Math.round(daysWent/planned*100))+'%':'—'}</b><span>asistencia vs días planeados</span></div>
    <div class="kpi"><b class="num">${avg!=null?avg+'%':'—'}</b><span>cumplimiento promedio</span></div>
    <div class="kpi"><b class="num">${weekStreak(p)}</b><span>semanas seguidas cumpliendo frecuencia</span></div>
  </div>
  <div class="card">
    <div class="row between" style="margin-bottom:12px">
      <button class="iconbtn" data-act="calNav" data-n="-1" aria-label="Mes anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <h3 style="margin:0;text-transform:capitalize">${MONTHS[m-1]} ${y}</h3>
      <button class="iconbtn" data-act="calNav" data-n="1" aria-label="Mes siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="cal">${DOW.map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>
    <div class="legend"><span><i style="background:var(--green)"></i>85% o más</span><span><i style="background:var(--yellow)"></i>50–84%</span><span><i style="background:var(--red)"></i>menos de 50%</span><span><i style="border:1.5px dashed var(--red)"></i>día planeado sin ir</span></div>
  </div>
  ${ui.selDate?`<div class="card"><h3 style="text-transform:capitalize">${fmtDate(ui.selDate,true)}</h3>
    ${sel.length? sel.map(s=>{ const pc=sessionScore(p,s); return `<div class="sess-item"><div class="plate ${scoreClass(pc)} num">${pc}%</div><div style="flex:1"><b>${esc(s.dayName)}</b><div class="muted" style="font-size:.85rem">Semana ${s.week} · ${s.endedAt?Math.round((s.endedAt-s.startedAt)/60000)+' min':''} · ${fmtN(sessionVolume(s),0)} kg${s.rpe?' · esfuerzo '+esc(s.rpe):''}</div></div>
      <button class="btn sm" data-act="viewSession" data-id="${s.id}">Ver</button></div>`;}).join('')
      : `<div class="empty">No hay sesión este día.<div style="margin-top:10px"><button class="btn sm" data-act="logPast" data-d="${ui.selDate}">Registrar sesión en esta fecha</button></div></div>`}
  </div>`:''}`;
}
function weekStreak(p){
  const ds = doneSessions(p); if(!ds.length) return 0;
  const freq = +p.info.frecuencia || 5;
  const count = {}; ds.forEach(s=>{ const k = iso(mondayOf(parseISO(s.date))); count[k] = (count[k]||0)+1; });
  let streak = 0, w = mondayOf(new Date());
  if((count[iso(w)]||0) >= freq) streak++;
  w = addDays(w,-7);
  while((count[iso(w)]||0) >= freq){ streak++; w = addDays(w,-7); }
  return streak;
}

/* ============================================================
   8. VISTA: PROGRESO
   ============================================================ */
function chartSVG(points, unit){
  if(points.length < 2) return `<div class="empty">Necesitas al menos 2 registros para ver la gráfica.</div>`;
  const W=640, H=220, L=44, R=56, T=18, B=28;
  const xs = points.map(p=>parseISO(p.x).getTime()), ys = points.map(p=>p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if(x0===x1){ x0-=864e5; x1+=864e5; }
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const padY = (y1-y0)*.15 || Math.max(1, y1*.05); y0-=padY; y1+=padY;
  const X = t => L + (t-x0)/(x1-x0)*(W-L-R), Y = v => T + (1-(v-y0)/(y1-y0))*(H-T-B);
  const d = points.map((p,i)=>`${i?'L':'M'}${X(xs[i]).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const grid = [0,.5,1].map(f=>{ const v = y0+(y1-y0)*f; return `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fmtN(v)}</text>`; }).join('');
  const last = points[points.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica de progreso">
    ${grid}
    <path d="${d}" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${points.map((p,i)=>`<circle cx="${X(xs[i])}" cy="${Y(p.y)}" r="${i===points.length-1?5:3.5}" fill="${p.c||'var(--blue)'}" stroke="var(--panel)" stroke-width="2"><title>${fmtDate(p.x)}: ${fmtN(p.y)} ${unit}</title></circle>`).join('')}
    <text class="lbl" x="${X(xs[xs.length-1])+8}" y="${Y(last.y)+5}">${fmtN(last.y)}</text>
    <text x="${L}" y="${H-6}">${fmtDate(points[0].x)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${fmtDate(last.x)}</text>
  </svg>`;
}
function weeklyVolume(p, offset){
  const mon = addDays(mondayOf(new Date()), -7*offset), sun = addDays(mon,6);
  const a = iso(mon), b = iso(sun);
  const v = {};
  doneSessions(p).filter(s=>s.date>=a && s.date<=b).forEach(s=> s.entries.forEach(en=>{
    if(!en.sets || en.skipped) return; const n = en.sets.filter(x=>x.done).length; v[en.snap.muscle] = (v[en.snap.muscle]||0) + n;
  }));
  return {v, a, b};
}
function viewProg(){
  const p = P();
  const ds = doneSessions(p);
  const exs = allEx(p).filter(e=>e.mode!=='cardio');
  if(!ui.progEx || !exs.find(e=>e.id===ui.progEx)) ui.progEx = exs[0] && exs[0].id;
  const e = exs.find(x=>x.id===ui.progEx);
  const month = iso(new Date()).slice(0,7);
  const last28 = iso(addDays(new Date(),-27));
  const freq = +p.info.frecuencia || 5;
  const recent = ds.filter(s=>s.date>=last28);
  const att = Math.min(100, Math.round(new Set(recent.map(s=>s.date)).size / (freq*4) * 100));
  const avg = recent.length ? Math.round(recent.reduce((a,s)=>a+sessionScore(p,s),0)/recent.length) : null;

  // volumen semanal
  const {v, a, b} = weeklyVolume(p, ui.volWeek);
  const vrows = Object.entries(p.targets).filter(([k,t])=>t>0 || v[k]).map(([k,t])=>{
    const n = v[k]||0, f = t? Math.min(1, n/t) : 1;
    const c = n>=t ? 'var(--green)' : f>=.5 ? 'var(--yellow)' : 'var(--red)';
    return `<div class="vbar"><span>${esc((MUSCLES[k]||{n:k}).n)}</span><span class="track"><i style="width:${Math.max(n?4:0,f*100)}%;background:${c}"></i></span><span class="v">${n}<span class="faint">/${t}</span></span></div>`;
  }).join('');

  // ejercicio
  let chart = '', table = '';
  if(e){
    const h = exHistory(p, e.id).filter(x=>x.en.sets && x.en.sets.some(s=>s.done));
    const pts = h.map(({s,en})=>{
      const done = en.sets.filter(x=>x.done);
      const y = ui.progMetric==='e1rm' ? Math.max(...done.map(x=>e1rm(num(x.w)||0,num(x.r)||0)))
        : ui.progMetric==='top' ? Math.max(...done.map(x=>num(x.w)||0))
        : ui.progMetric==='vol' ? done.reduce((a,x)=>a+(num(x.w)||0)*(num(x.r)||0),0)
        : done.reduce((a,x)=>a+(num(x.r)||0),0);
      return {x:s.date, y, c: isDeload(s.week)?'var(--yellow)':null};
    }).filter(p=>p.y>0);
    const unit = {e1rm:'kg',top:'kg',vol:'kg',reps:e.mode==='tiempo'?'s':'reps'}[ui.progMetric];
    chart = chartSVG(pts, unit);
    table = h.length ? `<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Sem</th><th>Series</th><th>Estado</th></tr></thead><tbody>${h.slice().reverse().slice(0,12).map(({s,en})=>{ const r=evalEntry(en.snap,en,s.week,false); return `<tr><td>${fmtDate(s.date)}</td><td class="num">${s.week}</td><td class="num">${en.sets.filter(x=>x.done).map(x=>`${x.w?fmtN(num(x.w))+'×':''}${x.r}`).join(' · ')}</td><td><span class="tag ${STATUS_TAG[r.status]}">${STATUS_TXT[r.status]}</span></td></tr>`;}).join('')}</tbody></table></div>` : '';
  }
  // PRs
  const prs = exs.map(x=>{
    let best = 0, date = null, set = null;
    exHistory(p, x.id).forEach(({s,en})=> (en.sets||[]).filter(t=>t.done).forEach(t=>{ const v = e1rm(num(t.w)||0, num(t.r)||0); if(v>best){best=v;date=s.date;set=t;} }));
    return best ? {x, best, date, set} : null;
  }).filter(Boolean).sort((a,b)=>b.best-a.best);

  return `
  <div class="view-head"><div><h2>Progreso</h2><p>Tus números, semana a semana.</p></div></div>

const BODY_FIELDS = [
  ['weight','Peso','kg'],['waist','Cintura','cm'],['hip','Cadera','cm'],['fat','Grasa corporal','%'],
  ['chest','Pecho','cm'],['arm','Brazo','cm'],['thigh','Muslo','cm'],['steps','Pasos promedio','pasos']
];
function viewCuerpo(){
  const p = P();
  const list = p.body.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const m = BODY_FIELDS.find(f=>f[0]===ui.bodyMetric) || BODY_FIELDS[0];
  const pts = list.filter(x=>num(x[m[0]])!=null).map(x=>({x:x.date, y:num(x[m[0]])}));
  // tendencia de peso
  const wpts = list.filter(x=>num(x.weight)!=null);
  let insight = '';
  if(wpts.length >= 2){
    const first = wpts[0], last = wpts[wpts.length-1];
    const avgOf = (from,to) => { const xs = wpts.filter(x=>x.date>from && x.date<=to).map(x=>num(x.weight)); return xs.length? xs.reduce((a,b)=>a+b,0)/xs.length : null; };
    const today = iso(new Date());
    const a1 = avgOf(iso(addDays(new Date(),-7)), today), a0 = avgOf(iso(addDays(new Date(),-14)), iso(addDays(new Date(),-7)));
    const total = num(last.weight) - num(first.weight);
    const weeks = Math.max(1, daysBetween(first.date, last.date)/7);
    const rate = total/weeks, ratePc = rate/num(first.weight)*100;
    let verdict;
    if(ratePc <= -1.2) verdict = 'Vas más rápido de lo recomendable: podrías perder músculo. Considera subir un poco las calorías.';
    else if(ratePc <= -0.4) verdict = 'Ritmo ideal para perder grasa conservando músculo.';
    else if(ratePc < 0) verdict = 'Bajando, aunque lento. Revisa pasos diarios y adherencia a la dieta.';
    else verdict = 'Sin bajar en promedio. Si tu objetivo es perder grasa, ajusta déficit o suma cardio/pasos.';
    insight = `<div class="card">
      <h3>Tendencia de peso</h3>
      <div class="grid3">
        <div><div class="num" style="font-size:1.8rem;font-weight:700">${total>0?'+':''}${fmtN(total)} kg</div><div class="faint" style="font-size:.85rem">desde ${fmtDate(first.date)}</div></div>
        <div><div class="num" style="font-size:1.8rem;font-weight:700">${ratePc>0?'+':''}${fmtN(ratePc,2)}%</div><div class="faint" style="font-size:.85rem">por semana</div></div>
        <div><div class="num" style="font-size:1.8rem;font-weight:700">${a1!=null?fmtN(a1):'—'}</div><div class="faint" style="font-size:.85rem">promedio 7 días${a0!=null&&a1!=null?` (${a1-a0>0?'+':''}${fmtN(a1-a0)})`:''}</div></div>
      </div>
      <p class="muted" style="margin-top:12px;font-size:.92rem">${verdict} Referencia: 0.5–1% de tu peso por semana.</p>
    </div>`;
  }
  return `
  <div class="view-head"><div><h2>Medidas</h2><p>${esc(p.info.enfasis||'Peso, perímetros y composición corporal.')}</p></div>
    <button class="btn primary sm" data-act="addBody">+ Registrar</button></div>
  ${insight}
  <div class="card">
    <div class="seg" style="margin-bottom:12px">${BODY_FIELDS.map(f=>`<button data-act="bodyMetric" data-m="${f[0]}" aria-pressed="${f[0]===m[0]}">${f[1]}</button>`).join('')}</div>
    ${chartSVG(pts, m[2])}
  </div>
  <div class="card">
    <h3>Historial</h3>
    ${list.length? `<div class="tablewrap"><table><thead><tr><th>Fecha</th>${BODY_FIELDS.slice(0,4).map(f=>`<th>${f[1]}</th>`).join('')}<th></th></tr></thead><tbody>
      ${list.slice().reverse().map(x=>`<tr><td>${fmtDate(x.date)}</td>${BODY_FIELDS.slice(0,4).map(f=>`<td class="num">${x[f[0]]!==''&&x[f[0]]!=null?fmtN(num(x[f[0]]))+' '+f[2]:'—'}</td>`).join('')}<td><button class="btn sm ghost" data-act="editBody" data-id="${x.id}">Editar</button></td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty">Registra tu primera medición. Pésate en ayunas, después del baño, 3 o más veces por semana: lo que importa es el promedio.</div>'}
  </div>
  <div class="card flat guide"><h3>Cómo medir</h3><ul>
    <li><b>Peso:</b> en ayunas, después de ir al baño, misma báscula.</li>
    <li><b>Cintura:</b> a la altura del ombligo, relajado, al final de exhalar.</li>
    <li><b>Cadera:</b> en la parte más prominente de los glúteos.</li>
    <li><b>Brazo y muslo:</b> en el punto medio, siempre del mismo lado.</li>
    <li>Fotos de frente, lado y espalda cada 4 semanas con la misma luz. A veces la cinta y las fotos cambian aunque la báscula no.</li>
  </ul></div>`;
}

  <form class="dlg-b stack" id="profForm" data-id="${esc(p.id||'')}">

    <div><label class="f">Color</label><div class="swatches" style="margin-top:6px">${PLATE_COLORS.map(c=>`<button type="button" data-act="pickColor" data-c="${c}" style="background:${c}" aria-pressed="${c===p.color}" aria-label="Color ${c}"></button>`).join('')}</div><input type="hidden" name="color" value="${p.color}"></div>
    ${isNew?`<p class="faint" style="font-size:.85rem">Empieza con la rutina original; puedes editarla en la pestaña Rutina.</p>`:''}

  <div class="dlg-f">${!isNew&&S.profiles.length>1?`<button class="btn danger" data-act="deleteProfile" data-id="${p.id}">Eliminar perfil</button>`:''}<button class="btn" data-act="closeDlg">Cancelar</button><button class="btn primary" data-act="saveProfile">Guardar</button></div>`;
}
function infoForm(p){
  const i = p.info;
  return `
  <div class="dlg-h"><h3 style="margin:0">Ficha de ${esc(p.name)}</h3><button class="iconbtn" data-act="closeDlg" aria-label="Cerrar">✕</button></div>
  <form class="dlg-b stack" id="infoForm">
    <div class="grid2"><label class="f">Edad<input name="edad" value="${esc(i.edad)}"></label><label class="f">Tiempo entrenando<input name="tiempo" value="${esc(i.tiempo)}"></label></div>
    <div class="grid2"><label class="f">Frecuencia (días/semana)<input type="number" name="frecuencia" min="1" max="7" value="${esc(i.frecuencia)}"></label><label class="f">Rutina<input name="rutina" value="${esc(i.rutina)}"></label></div>
    <label class="f">Énfasis del programa<input name="enfasis" value="${esc(i.enfasis)}" placeholder="Reducción de grasa, hipertrofia…"></label>
