function targetsForm(p){
  return `
  <div class="dlg-h"><h3 style="margin:0">Volumen objetivo</h3><button class="iconbtn" data-act="closeDlg" aria-label="Cerrar">✕</button></div>
  <form class="dlg-b" id="tgtForm"><p class="muted" style="font-size:.9rem;margin-bottom:10px">Series de trabajo por semana para cada grupo.</p>
    <div class="grid2">${Object.entries(MUSCLES).filter(([k])=>k!=='cardio').map(([k,v])=>`<label class="f">${v.n}<input type="number" min="0" name="${k}" value="${p.targets[k]||0}"></label>`).join('')}</div></form>
  <div class="dlg-f"><button class="btn" data-act="closeDlg">Cancelar</button><button class="btn primary" data-act="saveTargets">Guardar</button></div>`;
}
function download(name, text, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text],{type})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 500);
}

/* ============================================================
   12. DIÁLOGO, TEMPORIZADOR, WAKE LOCK
   ============================================================ */
const dlg = $('#dlg');
function openDlg(html){ dlg.innerHTML = html; if(!dlg.open) dlg.showModal(); }
function closeDlg(){ if(dlg.open) dlg.close(); }
dlg.addEventListener('click', e=>{ if(e.target===dlg) closeDlg(); });
dlg.addEventListener('close', ()=> setTimeout(()=>{ if(pendingRender) softRender(); }, 0));

let T = null, tInt = null, audioCtx = null;
function beep(freq=880, dur=.18){
  try{ audioCtx ||= new (window.AudioContext||window.webkitAudioContext)(); const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(.25, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime+dur); o.start(); o.stop(audioCtx.currentTime+dur); }catch(e){}
}
function startTimer(phases, onPhaseEnd){
  T = {phases, idx:0, end: Date.now()+phases[0].sec*1000, onPhaseEnd};
  try{ audioCtx ||= new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  $('#timer').hidden = false; clearInterval(tInt); tInt = setInterval(tick, 250); tick();
}
function tick(){
  if(!T) return;
  const ph = T.phases[T.idx];
  const left = Math.ceil((T.end-Date.now())/1000);
  $('#timerT').textContent = fmtClock(Math.max(0,left));
  $('#timerL').textContent = ph.label + (T.phases.length>1 ? ` · ${T.idx+1}/${T.phases.length}` : '');
  $('#timerBar').style.width = Math.max(0,Math.min(100, (1 - left/ph.sec)*100)) + '%';
  $('#timer').classList.toggle('ending', left<=5);
  if(left<=3 && left>0 && T.lastBeep!==left){ T.lastBeep = left; beep(660,.08); }
  if(left<=0){
    beep(990,.35); try{ navigator.vibrate && navigator.vibrate([250,120,250]); }catch(e){}
    T.onPhaseEnd && T.onPhaseEnd(T.idx, ph);
    T.idx++;
    if(T.idx >= T.phases.length){ stopTimer(); toast('Tiempo. A la siguiente serie.'); return; }
    T.end = Date.now() + T.phases[T.idx].sec*1000; T.lastBeep = null;
  }
}
function stopTimer(){ T = null; clearInterval(tInt); $('#timer').hidden = true; $('#timer').classList.remove('ending'); }

let wakeLock = null;
async function requestWake(){ try{ if('wakeLock' in navigator && liveSession(P())) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){} }
function releaseWake(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock = null; }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ requestWake(); tick(); sync(); } });
setInterval(()=>{ const el = $('#elapsed'); const s = liveSession(P()); if(el && s) el.textContent = Math.round((Date.now()-s.startedAt)/60000)+' min'; }, 30000);

/* ============================================================
   13. ACCIONES (delegación de eventos)
   ============================================================ */
const A = {
  tab(b){ ui.tab = b.dataset.tab; saveUI(); render(); window.scrollTo(0,0); },
  switchProfile(b){ if(S.active===b.dataset.id) return; S.active = b.dataset.id; ui.pickDay=null; ui.pickWeek=null; ui.selDate=null; ui.progEx=null; stopTimer(); save(); render(); toast('Perfil: '+P().name); },
  pickDay(b){ ui.pickDay = b.dataset.id; render(); },
  pickWeek(b){ ui.pickWeek = +b.dataset.w; render(); },
  startSession(b){ startSession(b.dataset.day, b.dataset.week); },
  toggleSet(b){
    const s = liveSession(P()), i = +b.dataset.i, k = +b.dataset.k, en = s.entries[i], st = en.sets[k];
    if(!st.done){
      // completar con los valores sugeridos (placeholder) si están vacíos
      const row = b.closest('.set'); const ins = row.querySelectorAll('input');
      const vals = [...ins].map(x=> x.value!=='' ? x.value : x.placeholder);
      if(vals[1]===''||vals[1]==null){ toast('Anota las repeticiones primero.'); ins[1].focus(); return; }
      st.w = vals[0]; st.r = vals[1]; st.rir = ins[2].value; st.done = true;
      if(en.snap.rest) startTimer([{label:'Descanso · '+en.snap.name, sec:en.snap.rest}]);
    } else st.done = false;
    save(); refreshCard(i);
  },
  addSet(b){ const en = liveSession(P()).entries[+b.dataset.i]; const l = en.sets[en.sets.length-1]||{}; en.sets.push({w:l.w||'',r:'',rir:'',done:false}); save(); refreshCard(+b.dataset.i); },
  removeSet(b){ const en = liveSession(P()).entries[+b.dataset.i]; if(en.sets.length>1){ en.sets.pop(); save(); refreshCard(+b.dataset.i);} },
  toggleSkip(b){ const en = liveSession(P()).entries[+b.dataset.i]; en.skipped = !en.skipped; save(); refreshCard(+b.dataset.i); },
  toggleExNote(b){ const en = liveSession(P()).entries[+b.dataset.i]; en.showNote = !en.showNote; refreshCard(+b.dataset.i); const inp = document.querySelector(`#ex-${b.dataset.i} [data-bind=exnote]`); inp && inp.focus(); },
  toggleWarm(b){ const en = liveSession(P()).entries[+b.dataset.i]; en.warm ||= []; en.warm[+b.dataset.k] = !en.warm[+b.dataset.k]; b.setAttribute('aria-pressed', !!en.warm[+b.dataset.k]); save();
    if(en.warm[+b.dataset.k]){ const last = +b.dataset.k === en.snap.approach-1; startTimer([{label: last?'Antes de la 1.ª serie de trabajo':'Entre aproximaciones', sec: last?150:30}]); } },
  toggleRound(b){ const en = liveSession(P()).entries[+b.dataset.i]; en.rounds ||= []; en.rounds[+b.dataset.k] = !en.rounds[+b.dataset.k]; save(); refreshCard(+b.dataset.i); },
  toggleCardio(b){ const en = liveSession(P()).entries[+b.dataset.i]; en.cdone = !en.cdone; if(en.cdone && !en.minutes) en.minutes = en.snap.minutes; save(); refreshCard(+b.dataset.i); },
  restTimer(b){ const en = liveSession(P()).entries[+b.dataset.i]; startTimer([{label:'Descanso · '+en.snap.name, sec:en.snap.rest}]); },
  hiitTimer(b){
    const i = +b.dataset.i, s = liveSession(P()), en = s.entries[i], e = en.snap, n = evalEntry(e,en,s.week,true).planned;
    const ph = [{label:'Calentamiento suave', sec:(e.warmMin||5)*60, t:'w'}];
    for(let k=0;k<n;k++){ ph.push({label:`Ronda ${k+1}: fuerte`, sec:e.work, t:'f', k}); ph.push({label:`Ronda ${k+1}: suave`, sec:e.easy, t:'s', k}); }
    startTimer(ph, (idx, p)=>{ if(p.t==='s'){ const cur = liveSession(P()); if(!cur) return; cur.entries[i].rounds ||= []; cur.entries[i].rounds[p.k] = true; save(); refreshCard(i); } });
  },
  timerAdd(){ if(T){ T.end += 15000; tick(); } },
  timerStop(){ stopTimer(); },
  finishSession(){ finishSession(); },
  discardSession(){ const p = P(), s = liveSession(p); if(!s || !confirm('¿Descartar esta sesión? Se pierde lo registrado.')) return; p.sessions = p.sessions.filter(x=>x.id!==s.id); p.deletedIds.push(s.id); stopTimer(); releaseWake(); save(); render(); toast('Sesión descartada'); },
  calNav(b){ const now = new Date(); const [y,m] = ui.calMonth ? ui.calMonth.split('-').map(Number) : [now.getFullYear(), now.getMonth()+1]; const d = new Date(y, m-1+(+b.dataset.n), 1); ui.calMonth = `${d.getFullYear()}-${d.getMonth()+1}`; render(); },
  selDate(b){ ui.selDate = ui.selDate===b.dataset.d ? null : b.dataset.d; render(); },
  viewSession(b){ const p = P(); const s = p.sessions.find(x=>x.id===b.dataset.id); s && openDlg(sessionDetail(p,s)); },
  deleteSession(b){ if(!confirm('¿Eliminar esta sesión del historial?')) return; const p = P(); p.sessions = p.sessions.filter(x=>x.id!==b.dataset.id); p.deletedIds.push(b.dataset.id); save(); closeDlg(); render(); toast('Sesión eliminada'); },
  reopenSession(b){
    const p = P(); if(liveSession(p)){ toast('Termina o descarta la sesión en curso primero.'); return; }
    const s = p.sessions.find(x=>x.id===b.dataset.id); s.status = 'live'; s._reopened = true; s._m = Date.now(); save(); closeDlg(); ui.tab='hoy'; render(); window.scrollTo(0,0);
  },
  logPast(b){
    const p = P(); if(liveSession(p)){ toast('Termina o descarta la sesión en curso primero.'); return; }
    const day = nextDay(p); startSession(day.id, cycleInfo(p, b.dataset.d).week);
    const s = liveSession(p); s.date = b.dataset.d; s.startedAt = parseISO(b.dataset.d).getTime()+18*3600e3; save();
    ui.tab='hoy'; render(); toast('Registrando sesión del '+fmtDate(b.dataset.d)+'. Cambia el día en Rutina si no corresponde.');
  },
  progMetric(b){ ui.progMetric = b.dataset.m; saveUI(); render(); },
  volWeek(b){ ui.volWeek = +b.dataset.n; render(); },
  bodyMetric(b){ ui.bodyMetric = b.dataset.m; saveUI(); render(); },
  addBody(){ openDlg(bodyForm()); },
  editBody(b){ openDlg(bodyForm(P().body.find(x=>x.id===b.dataset.id))); },
  saveBody(){
    const f = $('#bodyForm'); if(!f.reportValidity()) return; const fd = Object.fromEntries(new FormData(f));
    const p = P(); const rec = {id: fd.id || uid(), date: fd.date, note: fd.note, _m: Date.now()}; BODY_FIELDS.forEach(([k])=> rec[k] = fd[k]);
    if(!BODY_FIELDS.some(([k])=>rec[k]!=='')){ toast('Llena al menos una medida.'); return; }
    const i = p.body.findIndex(x=>x.id===rec.id); if(i>=0) p.body[i] = rec; else p.body.push(rec);
    save(); closeDlg(); render(); toast('Medición guardada');
  },
  deleteBody(b){ if(!confirm('¿Eliminar esta medición?')) return; const p = P(); p.body = p.body.filter(x=>x.id!==b.dataset.id); p.deletedIds.push(b.dataset.id); save(); closeDlg(); render(); },
  editInfo(){ openDlg(infoForm(P())); },
  saveInfo(){ const fd = Object.fromEntries(new FormData($('#infoForm'))); Object.assign(P().info, fd); save(); closeDlg(); render(); toast('Ficha guardada'); },
  editTargets(){ openDlg(targetsForm(P())); },
  saveTargets(){ const fd = Object.fromEntries(new FormData($('#tgtForm'))); const p = P(); Object.keys(fd).forEach(k=> p.targets[k] = +fd[k]||0); save(); closeDlg(); render(); },
  toggleTDay(b){ const p = P(), d = +b.dataset.d; p.trainingDays = p.trainingDays.includes(d) ? p.trainingDays.filter(x=>x!==d) : [...p.trainingDays, d]; save(); render(); },
  moveEx(b){ const p = P(), day = p.routine.find(d=>d.id===b.dataset.d), i = +b.dataset.i, j = i + (+b.dataset.n); if(j<0||j>=day.exercises.length) return; [day.exercises[i], day.exercises[j]] = [day.exercises[j], day.exercises[i]]; ui.openDay = day.id; save(); render(); },
  editEx(b){ const p = P(), day = p.routine.find(d=>d.id===b.dataset.d); ui.openDay = day.id; openDlg(exForm(day.id, b.dataset.id ? day.exercises.find(e=>e.id===b.dataset.id) : null)); },
  saveEx(){
    const f = $('#exForm'); if(!f.reportValidity()) return; const fd = Object.fromEntries(new FormData(f));
    const p = P(), day = p.routine.find(d=>d.id===f.dataset.day);
    const [mode, sub] = fd.mode.split(':');
    let e = day.exercises.find(x=>x.id===f.dataset.id);
    const isNew = !e; if(isNew){ e = {id:'e'+uid(), note:''}; }
    Object.assign(e, {name:fd.name.trim(), group:fd.group.trim()||(MUSCLES[fd.muscle]||{}).n||'', muscle:fd.muscle, mode, note:fd.note});
    if(mode==='cardio'){
      Object.assign(e, {type:'cardio', muscle:'cardio', kind:sub, approach:0, sets:0, repMin:0, repMax:0, rest:0, rir:''});
      if(sub==='hiit'){ e.rounds = +fd.sets||5; e.warmMin = +fd.minutes||5; e.work = e.work||60; e.easy = e.easy||60; } else { e.minutes = +fd.minutes||60; }
    } else {
      const rest = +fd.rest||0;
      Object.assign(e, {type:sub, approach:Math.min(3,+fd.approach||0), sets:Math.max(1,+fd.sets||1), repMin:+fd.repMin||0, repMax:Math.max(+fd.repMin||0,+fd.repMax||0), rest, restLabel:fmtRest(rest), rir:fd.rir||'1-2'});
      if(mode!=='fuerza') e.approach = 0;
    }
    if(isNew) day.exercises.push(e);
    save(); closeDlg(); render(); toast('Ejercicio guardado');
  },
  deleteEx(b){ if(!confirm('¿Quitar este ejercicio de la rutina? El historial se conserva.')) return; const day = P().routine.find(d=>d.id===b.dataset.d); day.exercises = day.exercises.filter(e=>e.id!==b.dataset.id); save(); closeDlg(); render(); },
  renameDay(b){ const day = P().routine.find(d=>d.id===b.dataset.d); const n = prompt('Nombre del día', day.name); if(n && n.trim()){ day.name = n.trim(); day.short = n.trim(); ui.openDay = day.id; save(); render(); } },
  copyRoutine(b){ const from = S.profiles.find(x=>x.id===b.dataset.from); if(!confirm(`¿Reemplazar la rutina de ${P().name} con la de ${from.name}? El historial se conserva.`)) return; const p = P(); p.routine = JSON.parse(JSON.stringify(from.routine)); p.targets = {...from.targets}; save(); render(); toast('Rutina copiada'); },
  resetRoutine(){ if(!confirm('¿Restaurar la rutina original? Se pierden tus cambios a la rutina (no el historial).')) return; P().routine = templateRoutine(); save(); render(); toast('Rutina restaurada'); },
  openSettings(){ openDlg(settingsHTML()); },
  closeDlg(){ closeDlg(); },
  theme(b){ S.theme = b.dataset.t; save(); applyTheme(); openDlg(settingsHTML()); },
  editProfile(b){ openDlg(profileForm(b.dataset.id ? S.profiles.find(p=>p.id===b.dataset.id) : null)); },
  pickColor(b){ const f = $('#profForm'); f.color.value = b.dataset.c; f.querySelectorAll('.swatches button').forEach(x=>x.setAttribute('aria-pressed', x===b)); },
  saveProfile(){
    const f = $('#profForm'); if(!f.reportValidity()) return; const fd = Object.fromEntries(new FormData(f));
    if(f.dataset.id){ Object.assign(S.profiles.find(p=>p.id===f.dataset.id), {name:fd.name.trim(), color:fd.color}); }
    else { const np = newProfile(fd.name.trim(), fd.color, {}); S.profiles.push(np); S.active = np.id; }
    save(); render(); openDlg(settingsHTML());
  },
  deleteProfile(b){
    const p = S.profiles.find(x=>x.id===b.dataset.id);
    if(prompt(`Esto borra todo el historial de ${p.name}. Escribe su nombre para confirmar:`) !== p.name) return;
    S.profiles = S.profiles.filter(x=>x.id!==p.id); SM.deletes.push(p.id); if(S.active===p.id) S.active = S.profiles[0].id; save(); render(); openDlg(settingsHTML()); toast('Perfil eliminado');
  },
  savePin(){ try{ localStorage.setItem(PIN_KEY, $('#pinInput').value.trim()); }catch(e){} toast('PIN guardado'); sync().then(()=>{ if(dlg.open) openDlg(settingsHTML()); }); },
  syncNow(){ setSync('saving'); sync().then(()=>{ toast(SYNC_TXT[syncState]); if(dlg.open) openDlg(settingsHTML()); }); },
  exportJSON(){ download(`bitacora-gym-${iso(new Date())}.json`, JSON.stringify(S,null,1), 'application/json'); toast('Respaldo descargado'); },
  importJSON(){ $('#importFile').click(); },
  exportCSV(){
    const p = P(); const rows = [['fecha','dia','semana','ejercicio','musculo','serie','kg','reps','rir','hecha','estado_ejercicio']];
    doneSessions(p).forEach(s=> s.entries.forEach(en=>{ const st = STATUS_TXT[evalEntry(en.snap,en,s.week,false).status];
      if(en.sets) en.sets.forEach((x,k)=> rows.push([s.date,s.dayName,s.week,en.snap.name,(MUSCLES[en.snap.muscle]||{}).n,k+1,x.w,x.r,x.rir,x.done?'sí':'no',en.skipped?'Saltado':st]));
      else rows.push([s.date,s.dayName,s.week,en.snap.name,'Cardio','',  '', en.minutes||(en.rounds||[]).filter(Boolean).length,'','',en.skipped?'Saltado':st]); }));
    download(`series-${p.name}-${iso(new Date())}.csv`, '﻿'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n'), 'text/csv');
  }
};

$('#importFile').addEventListener('change', async e=>{
  const f = e.target.files[0]; if(!f) return;
  try{
    const data = JSON.parse(await f.text());
    if(!data || !Array.isArray(data.profiles)) throw new Error('formato');
    const mode = confirm('Aceptar = combinar con lo que ya hay (agrega perfiles y sesiones nuevas).\nCancelar = reemplazar todo con el respaldo.');
    if(mode){
      data.profiles.forEach(ip=>{
        const cur = S.profiles.find(p=>p.id===ip.id || p.name===ip.name);
        if(!cur){ S.profiles.push(ip); return; }
        const ids = new Set(cur.sessions.map(s=>s.id)); ip.sessions.forEach(s=>{ if(!ids.has(s.id)) cur.sessions.push(s); });
        const bids = new Set(cur.body.map(b=>b.id)); (ip.body||[]).forEach(b=>{ if(!bids.has(b.id)) cur.body.push(b); });
      });
    } else { const keep = {active:S.active, theme:S.theme}; S = data; S.active = S.active||keep.active; S.theme = S.theme||keep.theme; }
    normalize(); save(); render(); closeDlg(); toast('Respaldo importado');
  }catch(err){ toast('El archivo no es un respaldo válido de la Bitácora.'); }
  e.target.value = '';
});

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const fn = A[b.dataset.act]; if(fn){ e.preventDefault(); fn(b, e); }
});
document.addEventListener('toggle', e=>{ if(e.target.classList && e.target.classList.contains('day-acc') && e.target.open) ui.openDay = e.target.dataset.day; }, true);

// Bindings de inputs (guardan sin re-renderizar para no perder el foco)
const BIND = {
  set(t){ const s = liveSession(P()); const en = s.entries[+t.dataset.i]; en.sets[+t.dataset.k][t.dataset.f] = t.value; save(); },
  warmW(t){ const s = liveSession(P()); const i = +t.dataset.i, en = s.entries[i]; en.warmW = t.value; save(); const w = num(t.value) ?? num(t.placeholder); const box = document.getElementById('warm-'+i); if(box) box.innerHTML = warmChips(en.snap, en, i, w); },
  sess(t){ const s = liveSession(P()); s[t.dataset.f] = t.value; save(); },
  cardio(t){ const s = liveSession(P()); s.entries[+t.dataset.i][t.dataset.f] = t.value; save(); },
  exnote(t){ const s = liveSession(P()); s.entries[+t.dataset.i].note = t.value; save(); },
  progEx(t){ ui.progEx = t.value; render(); },
  cycleStart(t){ if(t.value){ P().cycleStart = t.value; save(); } }
};
document.addEventListener('input', e=>{ const t = e.target; if(t.dataset && t.dataset.bind && t.dataset.bind!=='progEx' && t.dataset.bind!=='cycleStart') BIND[t.dataset.bind](t); });
document.addEventListener('change', e=>{
  const t = e.target; if(!t.dataset || !t.dataset.bind) return;
  if(t.dataset.bind==='progEx' || t.dataset.bind==='cycleStart'){ BIND[t.dataset.bind](t); render(); return; }
  if(t.dataset.bind==='cardio' || t.dataset.bind==='set'){ const i = +t.dataset.i; if(t.dataset.bind==='cardio') refreshCard(i); else { const en = liveSession(P()).entries[i]; if(en.sets[+t.dataset.k].done) refreshCard(i); } }
});

/* ============================================================
   14. ARRANQUE
   ============================================================ */
load();
render();
setSync(syncState);
sync();
if(liveSession(P())) requestWake();
</script>
